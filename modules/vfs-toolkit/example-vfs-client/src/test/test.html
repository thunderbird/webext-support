<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VFS Provider Tests</title>
  <style>
    body { font-family: monospace; padding: 1rem; background: #1e1e1e; color: #d4d4d4; }
    h1 { font-size: 1rem; color: #9cdcfe; margin-bottom: 1rem; }
    #controls { margin-bottom: 1rem; display: flex; gap: .5rem; align-items: center; }
    button { padding: .3rem .8rem; cursor: pointer; }
    #log { list-style: none; padding: 0; margin: 0; }
    #log li { padding: .2rem 0; border-bottom: 1px solid #333; font-size: .85rem; }
    .pass { color: #4ec9b0; }
    .fail { color: #f44747; }
    .info { color: #9cdcfe; }
    .summary { font-weight: bold; }
    .spinner { display: inline-block; width: .85rem; height: .85rem; border: 2px solid #555; border-top-color: #9cdcfe; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #target-info { margin-bottom: .75rem; font-size: .85rem; color: #ce9178; }
    .detail { margin: .3rem 0 .1rem 1.2rem; padding: .3rem .5rem; font-size: .78rem; color: #d7ba7d; white-space: pre-wrap; border-left: 2px solid #555; background: #252526; }
  </style>
</head>
<body>
  <h1>VFS Provider Tests</h1>
  <p id="target-info">Resolving target…</p>
  <div id="controls">
    <button id="btn-run">Run Tests</button>
    <span id="summary"></span>
  </div>
  <ul id="log"></ul>
  <script type="module" src="test.js"></script>
</body>
</html>
