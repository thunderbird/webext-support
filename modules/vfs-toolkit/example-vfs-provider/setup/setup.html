<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="setup.js" type="module"></script>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; font-size: 13px; }
      h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
      p { color: #555; margin: 0 0 20px; line-height: 1.5; }
      button { padding: 6px 16px; background: #2a7fd4; color: #fff; border: none;
               border-radius: 4px; cursor: pointer; font-size: 13px; }
      button:hover { background: #1a6fc4; }
    </style>
  </head>
  <body>
    <h2>Connect to Example Provider</h2>
    <p id="msg">Do you want to allow this add-on to connect to the storage of the example provider?</p>
    <button id="grant-btn">Grant Access</button>
  </body>
</html>
